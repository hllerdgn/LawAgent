# ════════════════════════════════════════════════════════
# LawAgent AI — Docker Compose
# ════════════════════════════════════════════════════════
#
# Kullanım:
#   API + Qdrant'ı başlat:
#     docker-compose up
#
#   Sadece API başlat (Qdrant Cloud kullanılıyorsa):
#     docker-compose up api
# ════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── Qdrant Vektör Veritabanı (yerel geliştirme için) ────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lawagent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI / Generator (Ana API) ──────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawagent_api
    env_file: .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    command: python main.py --api
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
