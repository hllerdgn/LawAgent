
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Law Firm Website Design</title>
    <style>
      html, body { height: 100%; margin: 0; background-color: #f8fafc; }
      #root { height: 100%; }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        font-family: system-ui, -apple-system, sans-serif;
      }
      .logo-box {
        position: relative;
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #1e3a5f, #152b47);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(30, 58, 95, 0.3);
        animation: pulseLogo 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      }
      .book-icon {
        position: absolute;
        bottom: 12px;
        right: 12px;
        opacity: 0.7;
      }
      .loader-text {
        margin-top: 24px;
        color: #1e3a5f;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.5px;
        animation: fadeText 1.5s infinite ease-in-out alternate;
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(30, 58, 95, 0.3); }
        50% { transform: scale(1.05); box-shadow: 0 20px 25px -5px rgba(30, 58, 95, 0.5); }
      }
      @keyframes fadeText {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="loader-container">
        <div class="logo-box">
          <svg class="scale-icon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="M7 21h10"/>
            <path d="M12 3v18"/>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
          </svg>
          <svg class="book-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="loader-text">LawAgent AI Başlatılıyor...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
